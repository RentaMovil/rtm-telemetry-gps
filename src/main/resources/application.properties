spring.application.name=rtm-telemetry-gps
server.port=${APP_TELEMETRY_GPS_PORT:3005}

# Carga las variables del archivo .env (solo en local)
spring.config.import=optional:file:.env[.properties]

# Base compartida rentamovil, con el usuario telemetry_app (nunca sa)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Las tablas las crea rtm-telemetry-gps-db (Liquibase). Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=telemetry
# Las fechas se leen y escriben en UTC (ver TelemetryGpsApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Seguridad de /tracking/*: iam (su clave pública se descarga de GET /jwks y se refresca sola si
# iam rota su clave de firma; la privada nunca sale de rtm-iam)
app.telemetry-gps.iam-url=${IAM_URL:http://localhost:3001}

# Seguridad de /locations: una clave fija compartida por todos los dispositivos GPS (sin columna
# propia por dispositivo en el modelo de datos documentado — decisión 2026-10-15).
app.telemetry-gps.device-api-key=${APP_TELEMETRY_GPS_DEVICE_API_KEY:}

# booking-reservation: solo para resolver rentalId -> gpsId en las consultas de /tracking/* (no
# en la ingesta de /locations, que no llama a nadie — ver README "Sin dependencias síncronas").
app.telemetry-gps.booking-url=${BOOKING_URL:http://localhost:3003}
app.telemetry-gps.booking-timeout=${BOOKING_TIMEOUT:3s}

# Clave compartida que deben enviar los otros microservicios en el header X-Internal-Key para
# llamar a /internal/**. Misma clave en booking-reservation, fleet-maintenance, payment-billing
# y telemetry-gps.
app.internal.api-key=${APP_INTERNAL_API_KEY:}
