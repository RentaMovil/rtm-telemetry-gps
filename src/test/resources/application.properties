# @DataJpaTest overrides: an embedded H2 replaces the datasource, and Hibernate creates the
# schema itself here (production uses validate because rtm-telemetry-gps-db/Liquibase owns the
# schema there; H2 has no Liquibase run against it, so it needs ddl-auto=create-drop instead).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
